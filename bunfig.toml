[serve.static]
env = "BUN_PUBLIC_*"
plugins = ["bun-plugin-tailwind"]

[test]
preload = ["./happydom.ts"]
coverage = true
coverageReporter = ["text", "lcov"] 
coveragePathIgnorePatterns = [
  # Exclude small pure utility files (client/features/**/*, client/lib/**/*)
  "**/calculateRemaining.ts",
  "**/formatTime.ts",
  "**/progressRing.ts",
  "**/timerStorage.ts",
  "**/authFlag.ts",
  "**/cn.ts",

  # Schema definitions only (table/column declarations); the `.references()`
  # FK callbacks are never invoked at runtime without FK pragma enforcement
  "src/server/db/schema.ts",

  # Exclude configuration files
  "*.config.js",
  "webpack.config.ts",
  "vite.config.ts",
  "happydom.ts",

  # Exclude specific test patterns
  "**/*.spec.ts",
  "**/*.e2e.ts",

  # Exclude build artifacts
  "dist/**",
  "build/**",

  # Exclude generated files
  "src/generated/**",
  "**/*.generated.ts",
  "src/shared/data/pokemonSpecies.ts",
  "scripts/generatePokemonSpecies.ts",

  # Exclude vendor/third-party code
  "vendor/**",
  "third-party/**"
]